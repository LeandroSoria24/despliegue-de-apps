# fly.toml app configuration file generated for despliegue-de-apps on 2026-09-14T18:34:04Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'despliegue-de-apps'
primary_region = 'gru'

[build]

[[mounts]]
  source = 'pb_data'
  destination = '/pb/pb_data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
